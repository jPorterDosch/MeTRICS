# MINIMAL SUBSET for MeTRICS -- see datasets_download/download_scannetpp.sh    #
################################################################################
#
# Trimmed from the stock config that ships with a ScanNet++ token. Three
# differences, all of them deliberate:
#
#  1. download_scenes -- the 228 scenes MeTRICS actually uses, not all 1018.
#     preprocess_scannetpp.py iterates DUSt3R's scannetpp_pairs/scene_list.json
#     and nothing else. That list has 229 entries; 280b83fcf3 is dropped
#     because it was removed from the release between v1 and v2 -- its mesh
#     404s, and preprocess renders depth from that mesh, so the scene is
#     unusable. Leaving it in would abort the whole download on the 404.
#
#  2. download_assets -- the 7 assets preprocess_scannetpp.py opens, replacing
#     the stock default_assets (which pulls original DSLR, undistorted DSLR,
#     point clouds, semantic meshes + annotations, iPhone depth and all 10
#     panocam streams: ~1.5 TB, almost none of it read).
#
#  3. keep_zipped -- the four DIRECTORY archives are kept as-is rather than
#     extracted, because preprocessing reads their members in place through
#     dust3r.utils.zipio. That is the whole inode argument: 11 inodes per
#     scene instead of ~1,650 (a sampled scene has 816 DSLR frames and 816
#     masks), i.e. ~2.5k for the dataset rather than ~375k. The single-FILE assets
#     that happen to be zip-wrapped for transport (scan_mesh_path,
#     iphone_video_mask_path) are still extracted -- keeping them zipped saves
#     no inodes and would only complicate every reader downstream.
#
# The token is NOT stored here. download_scannetpp.sh injects $SCANNETPP_TOKEN
# (or datasets_download/.scannetpp_token, which is gitignored) at run time.

###### token ###### injected by download_scannetpp.sh; do not commit a real one
token: <YOUR_TOKEN_HERE>

###### download the data here ###### overridden by download_scannetpp.sh
data_root: <DOWNLOAD_LOCATION_HERE>

# root url of the data
root_url: https://scannetpp.mlsg.cit.tum.de/scannetpp/download/v2?version=v1&token=TOKEN&file=FILEPATH

metadata_only: false
dry_run: false
verbose: false

# Only nvs_sem_train is listed, and that is load-bearing: all 228 scenes live
# there (verified against the live split files), so split resolution is
# unambiguous and nvs_sem_train has no exclude_assets entry. Adding the other
# splits could only let a scene resolve to one whose exclusions silently drop
# assets we need.
splits: [nvs_sem_train]

meta_files:
  - splits/nvs_sem_train.txt

# Exactly what preprocess_scannetpp.py opens:
#   dslr/colmap             -> load_sfm()   intrinsics + poses
#   dslr/resized_images     -> rgb_dir_dslr
#   dslr/resized_anon_masks -> mask_dir_dslr
#   iphone/colmap           -> load_sfm()
#   iphone/rgb.mkv          -> decoded to iphone/rgb        (ffmpeg stage)
#   iphone/rgb_mask.mkv     -> decoded to iphone/rgb_masks  (ffmpeg stage)
#   scans/mesh_aligned_0.05.ply -> pyrender depth rendering
#
# Deliberately absent: iphone depth.bin (depth is RENDERED from the mesh, not
# taken from the phone), point clouds, semantic meshes and annotations,
# nerfstudio transforms, dslr original/undistorted images, all panocam data.
download_assets: [
  dslr_colmap_dir, dslr_resized_dir, dslr_resized_mask_dir,
  iphone_colmap_dir, iphone_video_path, iphone_video_mask_path,
  scan_mesh_path,
]

# Which of the above the server delivers as <asset>.zip. Verified by HEAD
# against the live server, not assumed: rgb.mkv is served raw while rgb_mask
# and the mesh are zipped, which is not guessable from the file names.
zipped_assets: [
  dslr_colmap_dir, dslr_resized_dir, dslr_resized_mask_dir,
  iphone_colmap_dir, iphone_video_mask_path, scan_mesh_path,
]

# Archives kept instead of extracted -- the directory assets only (see 3 above)
keep_zipped: [
  dslr_colmap_dir, dslr_resized_dir, dslr_resized_mask_dir,
  iphone_colmap_dir,
]

# no exclusions apply to nvs_sem_train; kept so cfg.exclude_assets.get() works
exclude_assets: {}

